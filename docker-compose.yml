services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-cms-app
    ports:
      # Host port 0 = Docker assigns a random free port
      - "0:8000"
    environment:
      APP_NAME: "LaravelPress"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      CMS_NAME: "LaravelPress"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cms
      DB_USERNAME: cms
      DB_PASSWORD: cms_secret
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-cms-queue
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=90"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cms
      DB_USERNAME: cms
      DB_PASSWORD: cms_secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-cms-scheduler
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cms
      DB_USERNAME: cms
      DB_PASSWORD: cms_secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms

  postgres:
    image: postgres:16-alpine
    container_name: laravel-cms-db
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms_secret
    volumes:
      - cms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - cms

  redis:
    image: redis:7-alpine
    container_name: laravel-cms-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - cms

  # Optional WordPress embed (real WP plugins). Start with:
  #   docker compose --profile wordpress up -d
  wp_mysql:
    profiles: ["wordpress"]
    image: mysql:8.0
    container_name: laravel-cms-wp-mysql
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - cms_wp_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cms

  wordpress:
    profiles: ["wordpress"]
    image: wordpress:6.7-php8.2-apache
    container_name: laravel-cms-wordpress
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: wp_mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WP_BRIDGE_TOKEN: ${WP_BRIDGE_TOKEN:-laravelpress-dev-bridge-token}
    volumes:
      - cms_wp_data:/var/www/html
      - ./wordpress-bridge/mu-plugins:/var/www/html/wp-content/mu-plugins
    depends_on:
      wp_mysql:
        condition: service_healthy
    networks:
      - cms

networks:
  cms:
    driver: bridge

volumes:
  cms_pgdata:
  cms_wp_mysql:
  cms_wp_data:
